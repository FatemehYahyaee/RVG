name: Apply Render Storage Integration

on:
  push:
    branches:
      - render-upstash
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          if 'import storage\n' not in s:
              marker = 'import central\n'
              if marker not in s:
                  raise SystemExit('Cannot find import marker in main.py')
              s = s.replace(marker, marker + 'import storage\n', 1)

          old_host = '"host": os.environ.get("RAILWAY_PUBLIC_DOMAIN", "localhost"),'
          new_host = '"host": os.environ.get("RENDER_EXTERNAL_HOSTNAME", os.environ.get("RAILWAY_PUBLIC_DOMAIN", "localhost")),'
          if old_host in s:
              s = s.replace(old_host, new_host, 1)

          start = s.index('async def load_state():')
          end = s.index('\nasync def save_state():', start)
          new_load = '''async def load_state():
    global LINKS, AUTH, SUBS
    try:
        # Prefer durable Upstash state. If the key is missing/unavailable,
        # fall back to the existing local file and migrate it to Redis when possible.
        remote_data = await storage.load_state()
        data = remote_data
        if data is None:
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            if DATA_FILE.exists():
                async with aiofiles.open(DATA_FILE, "r", encoding="utf-8") as f:
                    raw = await f.read()
                data = json.loads(raw)
                if storage.enabled():
                    await storage.save_state(data)

        if data:
            LINKS.update(data.get("links", {}))
            SUBS.update(data.get("subs", {}))
            NODE_KEYS.update(data.get("node_keys", {}))
            for nid, n in (data.get("nodes") or {}).items():
                NODES[nid] = _normalize_node(n)
            if "password_hash" in data:
                AUTH["password_hash"] = data["password_hash"]
            CONFIG["disable_logging"] = bool(data.get("disable_logging", False))
            apply_logging_state()
            logger.info(
                f"State loaded: {len(LINKS)} links, {len(SUBS)} subs, "
                f"{len(NODES)} nodes, {len(NODE_KEYS)} node keys"
            )
    except Exception as e:
        logger.warning(f"Could not load state: {e}")
'''
          s = s[:start] + new_load + s[end:]

          start = s.index('async def save_state():')
          end = s.index('\n\n# ── Debounced save', start)
          new_save = '''async def save_state():
    async with SAVE_LOCK:
        data = {
            "links": dict(LINKS),
            "subs": dict(SUBS),
            "node_keys": dict(NODE_KEYS),
            "nodes": dict(NODES),
            "password_hash": AUTH["password_hash"],
            "disable_logging": CONFIG.get("disable_logging", False),
            "saved_at": datetime.now().isoformat(),
        }

        # Durable backend first. Keep the local write as a fallback/cache so
        # the existing file-based behavior remains useful outside Render.
        remote_ok = await storage.save_state(data)
        try:
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            tmp = DATA_FILE.with_suffix(".tmp")
            async with aiofiles.open(tmp, "w", encoding="utf-8") as f:
                await f.write(json.dumps(data, ensure_ascii=False, indent=2))
            tmp.replace(DATA_FILE)
        except Exception as e:
            if not remote_ok:
                logger.warning(f"Could not save state: {e}")
'''
          s = s[:start] + new_save + s[end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile main.py storage.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Upstash persistence and Render hostname"
          git push
